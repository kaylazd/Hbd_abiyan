<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hologram Birthday — Morphing Particles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root{
    --pink:#46b9ff;
    --pink-soft:#a0dcff;
    --bg:#030a14;
  }
  *{box-sizing:border-box;}
  html,body{
    height:100%; margin:0; overflow:hidden;
    background: radial-gradient(circle at 50% 45%, #08192b 0%, var(--bg) 60%, #000 100%);
    font-family:'Poppins', sans-serif;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  #canvas-wrap{position:fixed; inset:0;}
  canvas{display:block; touch-action:none; cursor:grab;}
  canvas:active{cursor:grabbing;}

  #hint{
    position:fixed; bottom:calc(18px + env(safe-area-inset-bottom,0px)); left:0; right:0;
    text-align:center; color:rgba(255,255,255,.5); font-size:12px; z-index:5;
    font-weight:300; pointer-events:none;
    text-shadow:0 0 8px rgba(70,185,255,.6);
    letter-spacing:1px;
    transition: opacity 1s ease;
    padding:0 12px;
  }
  .vignette{
    position:fixed; inset:0; z-index:2; pointer-events:none;
    background: radial-gradient(circle at 50% 50%, transparent 35%, rgba(0,0,0,.75) 90%);
  }
  .scanlines{
    position:fixed; inset:0; z-index:3; pointer-events:none;
    background: repeating-linear-gradient(
      0deg,
      rgba(70,185,255,0.025) 0px,
      rgba(70,185,255,0.025) 1px,
      transparent 1px,
      transparent 3px
    );
    mix-blend-mode: overlay;
    opacity: .5;
  }
  #zoom-ui{
    position:fixed;
    right: calc(14px + env(safe-area-inset-right,0px));
    bottom: calc(14px + env(safe-area-inset-bottom,0px));
    z-index: 7;
    display:flex; flex-direction:column; gap:8px;
    user-select:none;
  }
  .zoom-btn{
    width: 40px; height: 40px;
    border-radius: 50%;
    background: rgba(70,185,255,.08);
    border: 1px solid rgba(70,185,255,.35);
    color: #d6f1ff;
    font-size: 20px; font-weight: 500;
    font-family: 'Poppins', sans-serif;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    box-shadow: 0 0 14px rgba(70,185,255,.25), inset 0 0 10px rgba(70,185,255,.1);
    transition: transform .15s ease, background .2s ease, box-shadow .2s ease;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .zoom-btn:hover{
    background: rgba(70,185,255,.18);
    box-shadow: 0 0 22px rgba(70,185,255,.55), inset 0 0 12px rgba(70,185,255,.2);
  }
  .zoom-btn:active{ transform: scale(.9); }
  .zoom-btn.reset{ font-size: 14px; }
</style>
</head>
<body>
<div class="scanlines"></div>
<div class="vignette"></div>
<div id="canvas-wrap"></div>
<div id="hint">↻ Geser ke segala arah untuk memutar 360° &middot; scroll / cubit untuk zoom</div>
<div id="zoom-ui">
  <button class="zoom-btn" id="zoom-in" aria-label="Zoom in">+</button>
  <button class="zoom-btn" id="zoom-out" aria-label="Zoom out">−</button>
  <button class="zoom-btn reset" id="zoom-reset" aria-label="Reset view">⌂</button>
</div>

<script>
window.addEventListener('load', () => {
  const wrap = document.getElementById('canvas-wrap');
  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x030a14, 0.0065);

  const camera = new THREE.PerspectiveCamera(46, window.innerWidth/window.innerHeight, 0.1, 500);
  const CAM_START_Z = 88;
  const CAM_MIN_Z   = 34;
  const CAM_MAX_Z   = 170;
  let   camTargetZ  = CAM_START_Z;
  let   camCurrentZ = CAM_START_Z;
  camera.position.set(0, 0, camCurrentZ);

  const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.outputEncoding = THREE.sRGBEncoding;
  wrap.appendChild(renderer.domElement);

  // ============================================================
  //  TEXTURES
  // ============================================================
  function makeDotTexture(inner, mid){
    const c = document.createElement('canvas'); c.width = c.height = 128;
    const ctx = c.getContext('2d');
    const g = ctx.createRadialGradient(64,64,0,64,64,64);
    g.addColorStop(0, inner);
    g.addColorStop(0.3, mid);
    g.addColorStop(0.7, 'rgba(0,0,0,0.05)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,128,128);
    return new THREE.CanvasTexture(c);
  }
  function makeStarTexture(){
    const c = document.createElement('canvas'); c.width = c.height = 128;
    const ctx = c.getContext('2d');
    ctx.translate(64,64);
    const grad = ctx.createRadialGradient(0,0,0,0,0,64);
    grad.addColorStop(0,'rgba(255,255,255,1)');
    grad.addColorStop(0.2,'rgba(205,238,255,0.9)');
    grad.addColorStop(1,'rgba(70,185,255,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    for(let i=0;i<8;i++){
      const a = (i/8)*Math.PI*2;
      const r = i%2===0 ? 64 : 14;
      ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r);
    }
    ctx.closePath();
    ctx.fill();
    return new THREE.CanvasTexture(c);
  }

  const dotTex     = makeDotTexture('rgba(255,255,255,1)', 'rgba(70,185,255,0.9)');
  const dotTexSoft = makeDotTexture('rgba(225,245,255,1)', 'rgba(110,200,255,0.5)');
  const starTex    = makeStarTexture();

  // ============================================================
  //  SHAPE GENERATORS
  // ============================================================
  function heartPoint(t){
    const x = 16*Math.pow(Math.sin(t),3);
    const y = 13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t);
    return { x: x/16, y: y/16 };
  }
  function heartShape(i, n){
    const t = Math.random() * Math.PI * 2;
    const layer = Math.random();
    let rf;
    if (layer < 0.5)      rf = 0.90 + Math.random()*0.10;
    else if (layer < 0.8) rf = 0.55 + Math.random()*0.35;
    else                  rf = Math.pow(Math.random(), 0.5) * 0.55;
    const edge = heartPoint(t);
    const zBase = (Math.random()*2 - 1);
    const edgeDist = 1.0 - rf;
    const zMax = 0.55 * (0.3 + edgeDist * 0.7);
    const z = zBase * zMax;
    const s = 5.2;
    return { x: edge.x * rf * s, y: edge.y * rf * s + 0.4, z: z * s };
  }
  function flowerShape(i, n){
    const layers = 4;
    const layerIdx = Math.floor(Math.random() * layers);
    const layerT = layerIdx / (layers - 1);
    const petalCount = 5 + layerIdx * 2;
    const petalIdx = Math.floor(Math.random() * petalCount);
    const angle = (petalIdx / petalCount) * Math.PI * 2 + layerIdx * 0.4;
    const u = Math.random();
    const v = (Math.random() * 2 - 1);
    const petalLen = 1.6 + layerT * 2.2;
    const petalWidth = 0.55 + layerT * 0.55;
    const r = u * petalLen;
    const across = Math.sin(u * Math.PI) * petalWidth * v * 0.55;
    const curl = Math.sin(u * Math.PI * 0.5) * (0.4 + layerT * 0.8);
    const cx = Math.cos(angle) * r - Math.sin(angle) * across;
    const cy = Math.sin(angle) * r + Math.cos(angle) * across;
    const z = curl + layerT * 0.4 + Math.sin(u * Math.PI) * 0.25 * (Math.random()-0.5);
    const s = 3.4;
    return { x: cx * s, y: cy * s + 0.3, z: (z - 0.6) * s * 0.55 };
  }
  function butterflyShape(i, n){
    const side = Math.random() < 0.5 ? -1 : 1;
    const wing = Math.random() < 0.55 ? 'upper' : 'lower';
    const u = Math.random();
    const v = Math.random() * 2 - 1;
    let x, y, z;
    if (wing === 'upper'){
      const R = 2.4;
      const a = Math.PI * (0.15 + u * 0.85);
      const r = R * (1 - 0.15 * v * v);
      x = Math.cos(a) * r * 1.2 * side;
      y = Math.sin(a) * r + 1.2;
      z = (0.6 - u * 0.5) * (0.8 + v * 0.4) + Math.sin(u*3)*0.15;
    } else {
      const R = 1.9;
      const a = Math.PI * (0.15 + u * 0.85);
      const r = R * (1 - 0.2 * v * v);
      x = Math.cos(a) * r * 1.05 * side;
      y = -Math.sin(a) * r - 0.2;
      z = (0.5 - u * 0.4) * (0.8 + v * 0.4) + Math.sin(u*3)*0.12;
    }
    if (Math.random() < 0.06){
      x = (Math.random()-0.5) * 0.35;
      y = (Math.random()-0.5) * 3.5;
      z = (Math.random()-0.5) * 0.4;
    }
    const s = 1.9;
    return { x: x * s, y: y * s - 0.5, z: z * s };
  }
  function starShape(i, n){
    const spikes = 6;
    const spike = Math.floor(Math.random() * spikes);
    const angle = (spike / spikes) * Math.PI * 2;
    const u = Math.random();
    const v = Math.random() * 2 - 1;
    const r = u * 5.0;
    const width = (1 - u) * 0.7;
    const z = (1 - u) * 0.6 * (Math.random() * 2 - 1) + Math.sin(u * Math.PI) * 0.3;
    const cx = Math.cos(angle) * r - Math.sin(angle) * v * width;
    const cy = Math.sin(angle) * r + Math.cos(angle) * v * width;
    return { x: cx, y: cy, z: z * 1.4 };
  }
  function sphereShape(i, n){
    const r = Math.random();
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    const rad = 4.6 * Math.cbrt(r);
    return {
      x: Math.sin(phi) * Math.cos(theta) * rad,
      y: Math.cos(phi) * rad,
      z: Math.sin(phi) * Math.sin(theta) * rad
    };
  }
  function infinityShape(i, n){
    const t = Math.random() * Math.PI * 2;
    const s = 2.8;
    const x = s * 2.6 * Math.cos(t) / (1 + Math.sin(t)*Math.sin(t));
    const y = s * 1.4 * Math.sin(t) * Math.cos(t) / (1 + Math.sin(t)*Math.sin(t));
    const z = (Math.random() - 0.5) * 0.7;
    const j = (Math.random() - 0.5) * 0.4;
    return { x: x + j, y: y + j, z: z };
  }

  const SHAPES = [
    { name: 'hati',     fn: heartShape },
    { name: 'bunga',    fn: flowerShape },
    { name: 'kupu',     fn: butterflyShape },
    { name: 'bintang',  fn: starShape },
    { name: 'bola',     fn: sphereShape },
    { name: 'infinity', fn: infinityShape },
    { name: 'hati',     fn: heartShape },
  ];

  // ============================================================
  //  PARTICLE SYSTEM
  // ============================================================
  const COUNT = 18000;
  const positions      = new Float32Array(COUNT*3);
  const targetA        = new Float32Array(COUNT*3);
  const targetB        = new Float32Array(COUNT*3);
  const scatter        = new Float32Array(COUNT*3);
  const colors         = new Float32Array(COUNT*3);
  const sizes          = new Float32Array(COUNT);
  const baseSizes      = new Float32Array(COUNT);
  const seeds          = new Float32Array(COUNT);
  const delays         = new Float32Array(COUNT);

  const cA = new THREE.Color(0x38b6ff);
  const cB = new THREE.Color(0xcdefff);
  const cC = new THREE.Color(0x6fd0ff);
  const cD = new THREE.Color(0x8fc4ff);
  const cE = new THREE.Color(0x5fe0ff);
  const cF = new THREE.Color(0xffffff);

  for (let i=0; i<COUNT; i++){
    const p = heartShape(i, COUNT);
    positions[i*3]   = p.x;
    positions[i*3+1] = p.y;
    positions[i*3+2] = p.z;
    targetA[i*3]   = p.x;
    targetA[i*3+1] = p.y;
    targetA[i*3+2] = p.z;
    targetB[i*3]   = p.x;
    targetB[i*3+1] = p.y;
    targetB[i*3+2] = p.z;

    const pick = Math.random();
    let col;
    if (pick < 0.35)      col = cA.clone();
    else if (pick < 0.6)  col = cB.clone();
    else if (pick < 0.78) col = cC.clone();
    else if (pick < 0.9)  col = cD.clone();
    else if (pick < 0.97) col = cE.clone();
    else                  col = cF.clone();
    col.multiplyScalar(0.8 + Math.random()*0.4);
    colors[i*3]   = col.r;
    colors[i*3+1] = col.g;
    colors[i*3+2] = col.b;

    baseSizes[i] = 0.09 + Math.random()*0.13;
    sizes[i] = baseSizes[i];
    seeds[i] = Math.random();
    delays[i] = Math.random();
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('color',    new THREE.BufferAttribute(colors, 3));
  geo.setAttribute('aSize',    new THREE.BufferAttribute(sizes, 1));

  const matCore = new THREE.ShaderMaterial({
    uniforms: {
      uTex: { value: dotTex },
      uTime: { value: 0 },
      uPixelRatio: { value: renderer.getPixelRatio() },
      uProgress: { value: 0 }
    },
    vertexShader: `
      attribute float aSize;
      varying vec3 vColor;
      varying float vAlpha;
      uniform float uTime;
      uniform float uPixelRatio;
      void main(){
        vColor = color;
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        float pulse = 0.85 + 0.35 * sin(uTime*3.0 + position.x*0.5 + position.y*0.3);
        gl_PointSize = aSize * pulse * uPixelRatio * (280.0 / -mv.z);
        vAlpha = 0.72 + 0.28 * sin(uTime*3.5 + position.z*0.4);
        gl_Position = projectionMatrix * mv;
      }
    `,
    fragmentShader: `
      uniform sampler2D uTex;
      varying vec3 vColor;
      varying float vAlpha;
      void main(){
        vec4 tex = texture2D(uTex, gl_PointCoord);
        if (tex.a < 0.02) discard;
        gl_FragColor = vec4(vColor * vAlpha, tex.a * vAlpha);
      }
    `,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    vertexColors: true
  });

  const matHalo = new THREE.PointsMaterial({
    size: 0.95, map: dotTexSoft, color: 0x4fb8ff, transparent: true,
    opacity: 0.10, depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: true
  });

  const heartCore = new THREE.Points(geo, matCore);
  const heartHalo = new THREE.Points(geo, matHalo);
  const shapeGroup = new THREE.Group();
  shapeGroup.add(heartCore);
  shapeGroup.add(heartHalo);

  // ============================================================
  //  MORPH CONTROLLER
  // ============================================================
  const morphState = {
    currentIndex: 0,
    nextIndex: 1,
    phase: 'hold',
    phaseTime: 0,
    holdDuration: 3.4,
    scatterDuration: 1.4,
    gatherDuration: 1.9,
    progress: 0
  };

  function applyShapeToTarget(arr, shapeIndex){
    const fn = SHAPES[shapeIndex].fn;
    for (let i=0; i<COUNT; i++){
      const p = fn(i, COUNT);
      arr[i*3]   = p.x;
      arr[i*3+1] = p.y;
      arr[i*3+2] = p.z;
    }
  }
  function computeScatter(){
    for (let i=0; i<COUNT; i++){
      scatter[i*3]   = (Math.random() - 0.5) * 80;
      scatter[i*3+1] = (Math.random() - 0.5) * 80;
      scatter[i*3+2] = (Math.random() - 0.5) * 80;
    }
  }
  computeScatter();

  applyShapeToTarget(targetA, morphState.currentIndex);
  applyShapeToTarget(targetB, morphState.nextIndex);

  function easeInOutCubic(x){
    return x < 0.5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2;
  }

  // ============================================================
  //  GREETING TEXT — FLYING ACak TAPI TERARAH + FADE OUT
  // ============================================================
  const greetings = [
    "Selamat  Ulang  Tahun  Abiyan", "Happy  Birthday  Abiyan", "Feliz  Cumpleaños  Abiyan", "Joyeux  Anniversaire  Abiyan",
    "Alles  Gute  zum  Geburtstag  Abiyan", "Buon  Compleanno  Abiyan", "Feliz  Aniversário  Abiyan", "С  Днём  Рождения  Абиян",
    "お誕生日おめでとう  アビヤン", "생일  축하합니다  아비얀", "生日快乐  阿比扬", "عيد  ميلاد  سعيد  أبيان",
    "สุขสันต์วันเกิด  อาบิยัน", "Chúc  Mừng  Sinh  Nhật  Abiyan", "जन्मदिन  मुबारक  हो  अबियान", "Fijne  Verjaardag  Abiyan",
    "Doğum  Günün  Kutlu  Olsun  Abiyan", "Χρόνια  Πολλά  Αμπιγιάν", "יום  הולדת  שמח  אביאן", "Wszystkiego  Najlepszego  Abiyan",
    "Grattis  på  Födelsedagen  Abiyan", "Hyvää  Syntymäpäivää  Abiyan", "З  Днем  Народження  Абіян", "শুভ  জন্মদিন  অবিয়ান",
    "Heri  ya  Kuzaliwa  Abiyan", "Maligayang  Bati  Abiyan", "Selamat  Hari  Jadi  Abiyan", "تولدت  مبارک  ابیان",
    "Hau'oli  lā  Hānau  Abiyan", "Všechno  nejlepší  Abiyan"
  ];

  function makeTextSprite(text){
    const c = document.createElement('canvas');
    const ctx = c.getContext('2d');
    const fontSize = 72;
    ctx.font = `700 ${fontSize}px Poppins, Arial, sans-serif`;
    const padding = 70;
    const textW = Math.ceil(ctx.measureText(text).width);
    const w = textW + padding*2;
    const h = fontSize + padding*2;
    c.width = w; c.height = h;

    ctx.font = `700 ${fontSize}px Poppins, Arial, sans-serif`;
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'center';

    ctx.shadowColor = 'rgba(70,185,255,1)';
    ctx.shadowBlur = 48;
    ctx.fillStyle = '#e6f7ff';
    ctx.fillText(text, w/2, h/2);

    ctx.shadowColor = 'rgba(70,185,255,1)';
    ctx.shadowBlur = 22;
    ctx.fillStyle = '#9fdcff';
    ctx.fillText(text, w/2, h/2);

    ctx.shadowColor = 'rgba(150,215,255,1)';
    ctx.shadowBlur = 8;
    ctx.fillStyle = '#d6f1ff';
    ctx.fillText(text, w/2, h/2);

    ctx.shadowBlur = 0;
    ctx.fillStyle = '#c4ebff';
    ctx.fillText(text, w/2, h/2);

    const tex = new THREE.CanvasTexture(c);
    tex.minFilter = THREE.LinearFilter;
    tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    const spriteMat = new THREE.SpriteMaterial({
      map: tex, transparent:true, depthWrite:false, depthTest:false, opacity:1.0
    });
    const sprite = new THREE.Sprite(spriteMat);
    const scale = 0.023 * Math.min(1, 1250 / w);
    sprite.scale.set(w*scale, h*scale, 1);
    sprite.userData.baseScaleX = w*scale;
    sprite.userData.baseScaleY = h*scale;
    return sprite;
  }

  const textGroup = new THREE.Group();
  const textSprites = [];

  greetings.forEach((word, i) => {
    const sprite = makeTextSprite(word);

    // ==== PARAMETER ORBIT ACAK TAPI TERARAH (semua searah CCW) ====
    const radiusBase = 16 + Math.random() * 12;              // 16 - 28
    const radiusAmp  = 1.0 + Math.random() * 3.5;            // wobble radius
    const yBase      = (Math.random() - 0.5) * 12;           // -6 .. +6
    const yAmp       = 1.5 + Math.random() * 4.0;            // naik-turun
    const speed      = 0.08 + Math.random() * 0.14;          // kecepatan sudut (semua positif = searah)
    const phase      = (i / greetings.length) * Math.PI * 2 + Math.random() * 0.6; // sebar merata + jitter
    const wobbleFreq = 0.4 + Math.random() * 0.9;
    const wobblePh   = Math.random() * Math.PI * 2;
    const tiltZ      = (Math.random() - 0.5) * 0.5;          // kemiringan ringan
    const inOutAmp   = 0.6 + Math.random() * 1.8;            // masuk-keluar dari inti

    // ==== FADE OUT PARAMETER (muncul -> terlihat -> memudar) ====
    const fadeCycle  = 9 + Math.random() * 6;                // durasi 1 siklus (detik)
    const fadePhase  = Math.random() * fadeCycle;            // fase awal acak
    const fadeMin    = 0.05 + Math.random() * 0.08;          // opacity minimum (hampir hilang)

    sprite.userData = {
      baseScaleX: sprite.userData.baseScaleX,
      baseScaleY: sprite.userData.baseScaleY,
      radiusBase, radiusAmp,
      yBase, yAmp,
      speed, phase,
      wobbleFreq, wobblePh,
      tiltZ, inOutAmp,
      fadeCycle, fadePhase, fadeMin
    };

    textGroup.add(sprite);
    textSprites.push(sprite);
  });

  // ============================================================
  //  BACKGROUND STARS
  // ============================================================
  function makeStars(count, rMin, rMax, size, opacity, color, tex){
    const g = new THREE.BufferGeometry();
    const pos = new Float32Array(count*3);
    for (let i=0;i<count;i++){
      const r = rMin + Math.random()*(rMax-rMin);
      const a = Math.random()*Math.PI*2;
      const b = Math.acos(2*Math.random()-1);
      pos[i*3]   = Math.sin(b)*Math.cos(a)*r;
      pos[i*3+1] = Math.cos(b)*r;
      pos[i*3+2] = Math.sin(b)*Math.sin(a)*r;
    }
    g.setAttribute('position', new THREE.BufferAttribute(pos,3));
    const m = new THREE.PointsMaterial({
      size, map:tex||dotTex, color, transparent:true, opacity,
      blending:THREE.AdditiveBlending, depthWrite:false, sizeAttenuation:true
    });
    return new THREE.Points(g, m);
  }
  const sparkles1 = makeStars(600, 30, 70, 0.10, 0.55, 0xd6f0ff, dotTex);
  const sparkles2 = makeStars(180, 26, 55, 0.42, 0.40, 0x9fdcff, starTex);
  const sparkles3 = makeStars(1400, 55, 130, 0.07, 0.45, 0xb3d9ff, dotTex);

  // ============================================================
  //  FLOCK
  // ============================================================
  const flockCount = 700;
  const flockPositions = new Float32Array(flockCount * 3);
  const flockColors    = new Float32Array(flockCount * 3);
  const flockSizes     = new Float32Array(flockCount);
  const flockData      = [];

  const flockPalette = [
    new THREE.Color(0xcdefff),
    new THREE.Color(0x6fd0ff),
    new THREE.Color(0x38b6ff),
    new THREE.Color(0x8fc4ff),
    new THREE.Color(0x5fe0ff),
    new THREE.Color(0xffffff),
  ];

  for (let i = 0; i < flockCount; i++) {
    const r     = 7 + Math.random() * 17;
    const speed = 0.35 + Math.random() * 1.1;
    const phase = Math.random() * Math.PI * 2;
    const tilt  = (Math.random() - 0.5) * 1.4;
    const yOff  = (Math.random() - 0.5) * 9;
    const size  = 0.08 + Math.random() * 0.22;
    const wobbleAmp = 0.6 + Math.random() * 1.6;
    const wobbleFreq = 0.8 + Math.random() * 1.8;
    const wobblePhase = Math.random() * Math.PI * 2;
    flockData.push({ r, speed, phase, tilt, yOff, size, wobbleAmp, wobbleFreq, wobblePhase });

    let col;
    const pick = Math.random();
    if (pick < 0.35)      col = flockPalette[0].clone();
    else if (pick < 0.6)  col = flockPalette[1].clone();
    else if (pick < 0.78) col = flockPalette[2].clone();
    else if (pick < 0.9)  col = flockPalette[3].clone();
    else if (pick < 0.97) col = flockPalette[4].clone();
    else                  col = flockPalette[5].clone();

    col.multiplyScalar(0.7 + Math.random() * 0.6);
    flockColors[i*3]   = col.r;
    flockColors[i*3+1] = col.g;
    flockColors[i*3+2] = col.b;
    flockSizes[i] = size;
  }

  const flockGeo = new THREE.BufferGeometry();
  flockGeo.setAttribute('position', new THREE.BufferAttribute(flockPositions, 3));
  flockGeo.setAttribute('color',    new THREE.BufferAttribute(flockColors, 3));
  flockGeo.setAttribute('aSize',    new THREE.BufferAttribute(flockSizes, 1));

  const flockMat = new THREE.ShaderMaterial({
    uniforms: {
      uTex: { value: dotTex },
      uTime: { value: 0 },
      uPixelRatio: { value: renderer.getPixelRatio() }
    },
    vertexShader: `
      attribute float aSize;
      varying vec3 vColor;
      varying float vAlpha;
      uniform float uTime;
      uniform float uPixelRatio;
      void main(){
        vColor = color;
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        float twinkle = 0.7 + 0.6 * sin(uTime*4.5 + position.x*2.0 + position.y*1.5);
        gl_PointSize = aSize * twinkle * uPixelRatio * (280.0 / -mv.z);
        vAlpha = 0.7 + 0.3 * sin(uTime*2.5 + position.z*1.2);
        gl_Position = projectionMatrix * mv;
      }
    `,
    fragmentShader: `
      uniform sampler2D uTex;
      varying vec3 vColor;
      varying float vAlpha;
      void main(){
        vec4 tex = texture2D(uTex, gl_PointCoord);
        if (tex.a < 0.02) discard;
        gl_FragColor = vec4(vColor * (1.0 + vAlpha*0.5), tex.a * vAlpha);
      }
    `,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    vertexColors: true
  });

  const flockPoints = new THREE.Points(flockGeo, flockMat);
  const flockGlowMat = new THREE.PointsMaterial({
    size: 0.7, map: dotTexSoft, color: 0x8fd8ff, transparent: true,
    opacity: 0.14, depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: true
  });
  const flockGlow = new THREE.Points(flockGeo, flockGlowMat);

  const flockGroup = new THREE.Group();
  flockGroup.add(flockPoints);
  flockGroup.add(flockGlow);

  // ============================================================
  //  ORBIT TRAILS
  // ============================================================
  const orbitGroup = new THREE.Group();
  function makeOrbit(radius, color, opacity, segments){
    const pts = [];
    for (let i = 0; i <= segments; i++){
      const a = (i/segments) * Math.PI * 2;
      pts.push(new THREE.Vector3(Math.cos(a)*radius, 0, Math.sin(a)*radius));
    }
    const g = new THREE.BufferGeometry().setFromPoints(pts);
    const m = new THREE.LineBasicMaterial({
      color, transparent:true, opacity,
      blending: THREE.AdditiveBlending, depthWrite:false
    });
    return new THREE.Line(g, m);
  }
  const orbit1 = makeOrbit(12.0, 0xffffff, 0.35, 200);
  const orbit2 = makeOrbit(14.5, 0xffffff, 0.30, 200);
  const orbit3 = makeOrbit(17.5, 0xffffff, 0.28, 200);
  const orbit4 = makeOrbit(21.0, 0xffffff, 0.22, 220);

  orbit1.rotation.x = Math.PI/2 - 0.15;
  orbit2.rotation.x = Math.PI/2 + 0.25;
  orbit2.rotation.z = 0.3;
  orbit3.rotation.x = Math.PI/2 - 0.35;
  orbit3.rotation.z = -0.4;
  orbit4.rotation.x = Math.PI/2 + 0.45;
  orbit4.rotation.y = 0.6;

  orbitGroup.add(orbit1, orbit2, orbit3, orbit4);

  // ============================================================
  //  ENERGY RINGS
  // ============================================================
  const ringGroup = new THREE.Group();
  function makeRing(radius, tubeRadius, color, opacity, rotSpeed){
    const ringGeo = new THREE.TorusGeometry(radius, tubeRadius, 16, 220);
    const ringMat = new THREE.MeshBasicMaterial({
      color, transparent:true, opacity,
      blending: THREE.AdditiveBlending, depthWrite:false
    });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.userData.rotSpeed = rotSpeed;
    return ring;
  }
  const ring1 = makeRing(13.8, 0.025, 0xffffff, 0.4,  0.6);
  const ring2 = makeRing(15.8, 0.02, 0xffffff, 0.3, -0.45);
  const ring3 = makeRing(12.2, 0.022, 0xffffff, 0.25,  0.35);
  ringGroup.add(ring1, ring2, ring3);
  ringGroup.rotation.x = Math.PI/2 - 0.15;

  // ============================================================
  //  SCENE GROUP
  // ============================================================
  const sceneGroup = new THREE.Group();
  sceneGroup.add(shapeGroup);
  sceneGroup.add(textGroup);
  sceneGroup.add(sparkles1);
  sceneGroup.add(sparkles2);
  sceneGroup.add(sparkles3);
  sceneGroup.add(flockGroup);
  sceneGroup.add(orbitGroup);
  sceneGroup.add(ringGroup);
  scene.add(sceneGroup);

  // ============================================================
  //  INTERACTION — drag & zoom
  // ============================================================
  const autoSpeed = 0.0022;
  let dragging = false;
  let resettingTilt = false;
  let lastX = 0, lastY = 0;
  let dragTargetRotY = 0;
  let dragTargetRotX = 0;
  const DRAG_SENSITIVITY = 0.0016;

  let pinching = false;
  let pinchStartDist = 0;
  let pinchStartZ = 0;

  function pointerDown(x,y){
    dragging = true;
    resettingTilt = false;
    lastX = x; lastY = y;
    dragTargetRotY = sceneGroup.rotation.y;
    dragTargetRotX = sceneGroup.rotation.x;
  }
  function pointerMove(x,y){
    if (!dragging) return;
    const dx = x - lastX;
    const dy = y - lastY;
    lastX = x; lastY = y;
    dragTargetRotY += dx * DRAG_SENSITIVITY;
    dragTargetRotX += dy * DRAG_SENSITIVITY;
  }
  function pointerUp(){ dragging = false; }

  function clampZ(z){ return Math.max(CAM_MIN_Z, Math.min(CAM_MAX_Z, z)); }

  renderer.domElement.addEventListener('mousedown', e => pointerDown(e.clientX, e.clientY));
  window.addEventListener('mousemove', e => pointerMove(e.clientX, e.clientY));
  window.addEventListener('mouseup', pointerUp);

  renderer.domElement.addEventListener('touchstart', e => {
    if (e.touches.length === 1){
      const t = e.touches[0];
      pointerDown(t.clientX, t.clientY);
    } else if (e.touches.length === 2){
      pinching = true;
      dragging = false;
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      pinchStartDist = Math.hypot(dx, dy);
      pinchStartZ = camTargetZ;
    }
  }, {passive:true});

  renderer.domElement.addEventListener('touchmove', e => {
    if (e.touches.length === 1 && dragging){
      const t = e.touches[0];
      pointerMove(t.clientX, t.clientY);
    } else if (e.touches.length === 2 && pinching){
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      const dist = Math.hypot(dx, dy);
      const ratio = pinchStartDist / Math.max(1, dist);
      camTargetZ = clampZ(pinchStartZ * ratio);
    }
  }, {passive:true});

  renderer.domElement.addEventListener('touchend', e => {
    if (e.touches.length === 0){
      dragging = false;
      pinching = false;
    } else if (e.touches.length === 1){
      pinching = false;
      const t = e.touches[0];
      pointerDown(t.clientX, t.clientY);
    }
  });

  renderer.domElement.addEventListener('wheel', e => {
    e.preventDefault();
    const factor = Math.exp(e.deltaY * 0.0012);
    camTargetZ = clampZ(camTargetZ * factor);
  }, {passive:false});

  document.getElementById('zoom-in').addEventListener('click', () => {
    camTargetZ = clampZ(camTargetZ * 0.82);
  });
  document.getElementById('zoom-out').addEventListener('click', () => {
    camTargetZ = clampZ(camTargetZ * 1.22);
  });
  document.getElementById('zoom-reset').addEventListener('click', () => {
    camTargetZ = CAM_START_Z;
    resettingTilt = true;
  });

  // ============================================================
  //  ANIMATION LOOP
  // ============================================================
  const clock = new THREE.Clock();
  const flockPosAttr  = flockGeo.attributes.position;
  const shapePosAttr  = geo.attributes.position;
  const sizeAttr      = geo.attributes.aSize;
  let elapsed = 0;

  setTimeout(() => {
    const hint = document.getElementById('hint');
    if (hint) hint.style.opacity = '0';
  }, 14000);

  function animate(){
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);
    elapsed += dt;
    const t = elapsed;

    // ---------- KAMERA ZOOM ----------
    camCurrentZ += (camTargetZ - camCurrentZ) * 0.08;
    camera.position.z = camCurrentZ;

    // ---------- MORPH STATE MACHINE ----------
    morphState.phaseTime += dt;
    let progress = 0;

    if (morphState.phase === 'hold'){
      if (morphState.phaseTime >= morphState.holdDuration){
        morphState.phase = 'scatter';
        morphState.phaseTime = 0;
        computeScatter();
      }
      progress = 0;
    } else if (morphState.phase === 'scatter'){
      const p = Math.min(1, morphState.phaseTime / morphState.scatterDuration);
      progress = easeInOutCubic(p);
      if (p >= 1){
        morphState.phase = 'gather';
        morphState.phaseTime = 0;
        applyShapeToTarget(targetA, morphState.nextIndex);
        morphState.currentIndex = morphState.nextIndex;
        morphState.nextIndex = (morphState.nextIndex + 1) % SHAPES.length;
        applyShapeToTarget(targetB, morphState.nextIndex);
      }
    } else {
      const p = Math.min(1, morphState.phaseTime / morphState.gatherDuration);
      progress = 1 - easeInOutCubic(p);
      if (p >= 1){
        morphState.phase = 'hold';
        morphState.phaseTime = 0;
        progress = 0;
      }
    }

    morphState.progress = progress;
    matCore.uniforms.uProgress.value = progress;

    // ---------- UPDATE PARTICLE POSITIONS ----------
    const posArr = shapePosAttr.array;
    for (let i = 0; i < COUNT; i++){
      const i3 = i*3;
      const ax = targetA[i3],   ay = targetA[i3+1], az = targetA[i3+2];
      const sx = scatter[i3],   sy = scatter[i3+1], sz = scatter[i3+2];
      const d = delays[i] * 0.35;
      let pp = (progress - d) / (1 - 0.35);
      pp = Math.max(0, Math.min(1, pp));
      const e = pp * pp * (3 - 2 * pp);
      posArr[i3]   = ax + (sx - ax) * e;
      posArr[i3+1] = ay + (sy - ay) * e;
      posArr[i3+2] = az + (sz - az) * e;
    }
    shapePosAttr.needsUpdate = true;

    const morphGlow = 1 + progress * 1.6;
    for (let i = 0; i < COUNT; i++){
      sizeAttr.array[i] = baseSizes[i] * morphGlow;
    }
    sizeAttr.needsUpdate = true;

    // ---------- SHAPE GROUP ANIMATION ----------
    const beat = 1 + Math.sin(t*2.4)*0.02 + Math.max(0, Math.sin(t*4.8))*0.012;
    shapeGroup.scale.setScalar(beat);
    shapeGroup.rotation.y = t * 0.28;
    shapeGroup.rotation.x = Math.sin(t*0.45) * 0.14;

    matCore.uniforms.uTime.value = t;
    flockMat.uniforms.uTime.value = t;

    // ---------- TEXT: FLYING + FADE OUT ----------
    for (let i = 0; i < textSprites.length; i++){
      const s = textSprites[i];
      const u = s.userData;

      // Sudut orbit maju (semua searah)
      const angle = t * u.speed + u.phase;

      // Radius bergelombang lembut (acak tapi terarah)
      const radius = u.radiusBase + Math.sin(t * u.wobbleFreq + u.wobblePh) * u.radiusAmp;

      // Ketinggian naik-turun + masuk-keluar inti
      const y = u.yBase + Math.sin(t * u.wobbleFreq * 0.8 + u.wobblePh) * u.yAmp;
      const inOut = Math.cos(t * u.wobbleFreq * 0.5 + u.wobblePh) * u.inOutAmp;

      const rEff = radius + inOut;

      s.position.x = Math.cos(angle) * rEff;
      s.position.z = Math.sin(angle) * rEff;
      s.position.y = y;

      // Kemiringan ringan sesuai orbit
      s.rotation = 0; // Sprite selalu menghadap kamera, tidak perlu rotasi
      s.material.rotation = Math.sin(t * 0.5 + u.phase) * u.tiltZ * 0.15;

      // FADE OUT: siklus sinus -> opacity naik turun
      const fadeT = (t + u.fadePhase) / u.fadeCycle * Math.PI * 2;
      const fadeRaw = (Math.sin(fadeT) + 1) * 0.5; // 0..1
      // Biar tidak benar-benar 0 → pakai fadeMin sebagai dasar
      const fade = u.fadeMin + (1 - u.fadeMin) * Math.pow(fadeRaw, 1.4);

      // Opacity
      s.material.opacity = fade;

      // Scale sedikit ikut fade biar terasa "bernapas"
      const scl = 0.85 + fade * 0.25 + Math.sin(t * 1.5 + u.phase) * 0.05;
      s.scale.set(u.baseScaleX * scl, u.baseScaleY * scl, 1);

      // Sembunyikan sprite saat fade sangat kecil untuk hemat render
      s.visible = fade > 0.04;
    }

    // ---------- SPARKLES ----------
    sparkles1.rotation.y -= 0.0010;
    sparkles1.rotation.x += 0.0004;
    sparkles2.rotation.y += 0.0015;
    sparkles2.rotation.x += 0.0007;
    sparkles3.rotation.y -= 0.0006;
    sparkles3.rotation.z += 0.0004;

    // ---------- RINGS ----------
    ring1.rotation.z += ring1.userData.rotSpeed * 0.015;
    ring2.rotation.z += ring2.userData.rotSpeed * 0.015;
    ring3.rotation.z += ring3.userData.rotSpeed * 0.015;
    ringGroup.rotation.y = t * 0.15;
    ringGroup.rotation.x = Math.PI/2 - 0.15 + Math.sin(t*0.4)*0.1;

    // ---------- ORBITS ----------
    orbit1.rotation.y = t * 0.25;
    orbit2.rotation.y = t * 0.18;
    orbit3.rotation.y = t * 0.32;
    orbit4.rotation.y = t * 0.22;
    orbit2.rotation.z = 0.3 + Math.sin(t*0.4)*0.15;
    orbit3.rotation.z = -0.4 + Math.cos(t*0.5)*0.15;

    // ---------- FLOCK ----------
    for (let i = 0; i < flockCount; i++) {
      const d = flockData[i];
      const angle = t * d.speed + d.phase;
      const wobbleT = t * d.wobbleFreq + d.wobblePhase;
      const wobbleR = Math.sin(wobbleT) * d.wobbleAmp;
      const wobbleY = Math.cos(wobbleT * 1.3) * d.wobbleAmp * 0.6;
      const rEff = d.r + wobbleR;
      const x = Math.cos(angle) * rEff;
      const z = Math.sin(angle) * rEff;
      const y = Math.sin(angle * 0.6 + d.phase) * 1.5 + d.yOff + wobbleY;
      const cosT = Math.cos(d.tilt);
      const sinT = Math.sin(d.tilt);
      const yRot = y * cosT - z * sinT;
      const zRot = y * sinT + z * cosT;
      flockPosAttr.array[i*3]     = x;
      flockPosAttr.array[i*3+1] = yRot;
      flockPosAttr.array[i*3 + 2] = zRot;
    }
    flockPosAttr.needsUpdate = true;

    flockGroup.rotation.y = t * 0.40;
    flockGroup.rotation.x = Math.sin(t * 0.6) * 0.20;
    flockGroup.rotation.z = Math.cos(t * 0.5) * 0.14;
    flockGlowMat.opacity = 0.10 + Math.sin(t * 2.0) * 0.05;

    // ---------- ROTASI SCENE ----------
    if (dragging) {
      sceneGroup.rotation.y += (dragTargetRotY - sceneGroup.rotation.y) * 0.12;
      sceneGroup.rotation.x += (dragTargetRotX - sceneGroup.rotation.x) * 0.12;
    } else {
      sceneGroup.rotation.y += autoSpeed;
      if (resettingTilt){
        const full = Math.PI * 2;
        const goal = Math.round(sceneGroup.rotation.x / full) * full;
        sceneGroup.rotation.x += (goal - sceneGroup.rotation.x) * 0.08;
        if (Math.abs(goal - sceneGroup.rotation.x) < 0.002) resettingTilt = false;
      }
      dragTargetRotY = sceneGroup.rotation.y;
      dragTargetRotX = sceneGroup.rotation.x;
    }

    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    matCore.uniforms.uPixelRatio.value = renderer.getPixelRatio();
    flockMat.uniforms.uPixelRatio.value = renderer.getPixelRatio();
  });
});
</script>
</body>
</html>
